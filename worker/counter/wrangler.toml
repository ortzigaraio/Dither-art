name = "horain-counter"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Serves the Worker on its own subdomain (Cloudflare creates the DNS record automatically).
# The site's CSP already allows https://count.ortzigar.org. If you change it, update the CSP in index.html too.
# (Top-level keys must stay above the [tables] below, or TOML attaches them to the previous table.)
routes = [{ pattern = "count.ortzigar.org", custom_domain = true }]

# Sites allowed to increment the counter (exact origins, comma-separated, no trailing slash).
[vars]
ALLOWED_ORIGINS = "https://dither.ortzigar.org,https://ortzigaraio.github.io,http://localhost:8080"

[[d1_databases]]
binding = "DB"
database_name = "horain-counter"
database_id = "REPLACE_WITH_THE_ID_PRINTED_BY_wrangler_d1_create"

# Optional per-IP rate limit: 10 hits per minute. If `wrangler deploy` rejects this block, delete it;
# the Worker still runs without it.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
